name: traccar_flutter
description: Flutter application for Traccar GPS tracking server API integration.
# Aplikacioni Flutter për integrimin me Traccar GPS tracking server API.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client for REST API calls / Klient HTTP për thirrjet REST API
  http: ^1.2.0

  # Local storage for credentials / Ruajtja lokale e kredencialeve
  shared_preferences: ^2.2.2

  # Map widget using OpenStreetMap / Widget hartë duke përdorur OpenStreetMap
  flutter_map: ^6.1.0

  # Latitude/Longitude support / Mbështetje Gjerësi/Gjatësi gjeografike
  latlong2: ^0.9.0

  # Date/time formatting / Formatimi i datës/orës
  intl: ^0.19.0

  # State management / Menaxhimi i gjendjes
  provider: ^6.1.2

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
